version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Amsterdam
    groups:
      compatible-updates:
        update-types:
          - minor
          - patch
    ignore:
      # Keep Node.js types aligned with the Node 24 runtime used in CI.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Amsterdam
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /services/downloadvideo
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Amsterdam
